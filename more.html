    <style>
      @keyframes pulse {
        0%,
        100% {
          transform: scale(1);
          opacity: 1;
        }
        50% {
          transform: scale(1.05);
          opacity: 0.8;
        }
      }

      .section-card {
        background: var(--bg-2-color);
        border: 2px solid var(--border-color);
        border-radius: var(--border-radius);
        padding: 50px 40px;
        margin-bottom: 30px;
        box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
        transition:
          transform 0.2s,
          border-color 0.2s;
      }

      .section-card:hover {
        transform: translateY(-5px);
        border-color: var(--primary-color);
      }

      .section-header {
        text-align: center;
        margin-bottom: 35px;
      }

      .section-icon {
        font-size: 64px;
        color: var(--primary-color);
        margin-bottom: 15px;
      }

      .section-icon.pulse {
        animation: pulse 2s infinite;
      }

      .section-title {
        color: var(--primary-color);
        margin: 0 0 15px 0;
        font-size: 2rem;
        font-weight: 700;
      }

      .section-subtitle {
        font-size: 1rem;
        color: var(--text-color);
        opacity: 0.7;
        max-width: 600px;
        margin: 0 auto;
      }

      .credits-grid,
      .partners-grid {
        display: flex;
        justify-content: center;
        gap: 20px;
        /* flex-wrap: wrap; */
        margin-top: 30px;
      }

      .credit-card,
      .partner-card {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        width: 140px;
        height: 140px;
        background-color: color-mix(in srgb, var(--bg-2-color) 80%, white 5%);
        border: 2px solid var(--border-color);
        border-radius: var(--border-radius);
        text-align: center;
        color: var(--text-color);
        transition: all 0.2s;
        text-decoration: none;
        padding: 20px;
        cursor: pointer;
      }

      .credit-card:hover,
      .partner-card:hover {
        transform: scale(1.05);
        border-color: var(--primary-color);
      }

      .credit-card img,
      .partner-card img {
        width: 60px;
        height: 60px;
        margin-bottom: 10px;
        border-radius: 50%;
        object-fit: cover;
      }

      .credit-card .fa-brands,
      .partner-card .fa-brands,
      .credit-card .fa-solid,
      .partner-card .fa-solid {
        font-size: 48px;
        margin-bottom: 10px;
        color: var(--primary-color);
      }

      .card-label {
        font-size: 1rem;
        font-weight: 600;
        word-wrap: break-word;
      }

      .action-buttons {
        display: flex;
        justify-content: center;
        gap: 15px;
        flex-wrap: wrap;
        margin-top: 25px;
      }

      .btn-with-icon {
        display: flex;
        align-items: center;
        gap: 8px;
        text-decoration: none;
      }
      .credits-card {
        width: 500px;
      }
      .donate-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
        gap: 20px;
        margin-top: 30px;
      }

      .donate-card {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-height: 180px;
        width: 100%;
        background-color: color-mix(in srgb, var(--bg-2-color) 80%, white 5%);
        border: 2px solid var(--border-color);
        border-radius: var(--border-radius);
        text-align: center;
        color: var(--text-color);
        transition: all 0.2s;
        padding: 20px;
        text-decoration: none;
      }

      .donate-card:hover {
        transform: scale(1.05);
        border-color: var(--primary-color);
      }

      .donate-card i {
        font-size: 48px;
        margin-bottom: 15px;
        color: var(--primary-color);
      }

      .donate-card .card-label {
        font-size: 1rem;
        font-weight: 600;
        margin-bottom: 10px;
      }

      .donate-card p {
        font-size: 0.75rem;
        word-break: break-all;
        margin: 0;
        cursor: pointer;
        padding: 8px;
        border-radius: 6px;
        background: var(--bg-2-color);
        transition: background 0.2s;
        width: 100%;
      }

      .donate-card p:hover {
        background: var(--primary-color);
      }

      @media (max-width: 768px) {
        .donate-grid {
          grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
        }
        
        .donate-card {
          min-height: 160px;
          padding: 15px;
        }
      }
      @media (max-width: 600px) {
        .section-card {
          padding: 30px 20px;
        }

        .section-icon {
          font-size: 48px;
        }

        .section-title {
          font-size: 1.5rem;
        }
      }
    </style>
